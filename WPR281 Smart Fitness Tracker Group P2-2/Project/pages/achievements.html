<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achievements</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Achievements</h1>
      <!-- Navigation links to different sections of the app -->
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="workouts.html">Log Workout</a></li>
          <li><a href="stats.html">Workout Stats</a></li>
          <li><a href="goals.html">Fitness Goals</a></li>
          <li><a href="favorites.html">Favorites</a></li>
          <li><a href="achievements.html">Achievements</a></li>
          <li><a href="challenge.html">Challenges</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Countdown timer display -->
      <div id="countdown">00:00:00</div>

      <!-- Section for unfinished achievements -->
      <section>
        <h2>Unfinished Achievements</h2>
        <div id="unfinished-achievements" class="grid-container">
          <!-- List of achievements yet to be completed -->
          <div class="achievement" data-id="first-workout">
            First Workout Logged 🏆
          </div>
          <div class="achievement" data-id="burn-1000">
            Burn 1000 Calories 🔥
          </div>
          <div class="achievement" data-id="five-workouts">
            5 Workouts in a Week 💪
          </div>
          <div class="achievement" data-id="train-10-hours">
            Train for 10 Hours ⏳
          </div>
        </div>
      </section>

      <!-- Section for completed achievements -->
      <section>
        <h2>Completed Achievements</h2>
        <div id="completed-achievements" class="grid-container"></div>
      </section>

      <!-- Button to reset achievements -->
      <section>
        <button id="reset-achievements">Reset Achievements</button>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Smart Fitness Tracker</p>
    </footer>

    <!-- Scripts for achievements and challenge functionality -->
    <script src="../js/achievements.js"></script>
    <script src="../js/challenge.js"></script>
  </body>
</html>
