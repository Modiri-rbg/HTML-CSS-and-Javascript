<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Workout</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Log Your Workout</h1>
      <!-- Navigation links to different sections of the app -->
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="workouts.html">Log Workout</a></li>
          <li><a href="stats.html">Workout Stats</a></li>
          <li><a href="goals.html">Fitness Goals</a></li>
          <li><a href="favorites.html">Favorites</a></li>
          <li><a href="achievements.html">Achievements</a></li>
          <li><a href="challenge.html">Challenges</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="countdown">00:00:00</div>
      <section id="Workout-Page">
        <h2>Log a New Workout</h2>
        <!-- Workout Logging Section -->
        <form id="workout-form">
          <label for="workout-type">Workout Type:</label>
          <select id="workout-type" required>
            <option value="running">Running</option>
            <option value="cycling">Cycling</option>
            <option value="strength-training">Strength Training</option>
            <option value="swimming">Swimming</option>
            <option value="walking">Walking</option>
            <option value="functional-training">Functional Training</option>
            <option value="aerobics">Aerobics</option>
          </select>
          <label for="duration">Duration (minutes):</label>
          <input type="number" id="duration" required />
          <label for="calories">Calories Burned:</label>
          <input type="number" id="calories" required />
          <label for="date">Date:</label>
          <input type="date" id="date" required />
          <button type="submit">Log Workout</button>
          <!-- button ids  -->
          <button id="reminder-btn">Get a Workout Tip</button>
        </form>
      </section>
      <section>
        <div class="workout-header">
          <h2>Logged Workouts</h2>
          <div class="workout-actions">
            <button id="print-all-btn" class="print-btn">Print All</button>
            <button id="delete-all-btn" class="delete-btn">❌</button>
          </div>
        </div>
        <ul id="workout-list"></ul>
      </section>
      
    </main>
    <footer>
      <p>&copy; 2025 Smart Fitness Tracker</p>
    </footer>
    <script src="../js/app.js"></script>
    <script src="../js.achievements.js"></script>
    <script src="../js/challenge.js"></script>
  </body>
</html>
