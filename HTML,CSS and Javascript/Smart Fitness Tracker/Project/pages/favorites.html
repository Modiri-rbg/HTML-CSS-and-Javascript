<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Favorites</h1>
      <nav>
        <ul>
          <!-- Navigation links to different sections of the app -->
          <li><a href="../index.html">Home</a></li>
          <li><a href="workouts.html">Log Workout</a></li>
          <li><a href="stats.html">Workout Stats</a></li>
          <li><a href="goals.html">Fitness Goals</a></li>
          <li><a href="favorites.html">Favorites</a></li>
          <li><a href="achievements.html">Achievements</a></li>
          <li><a href="challenge.html">Challenges</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Countdown timer display -->
      <div id="countdown">00:00:00</div>

      <!-- Section displaying the user's favorite workouts -->
      <section>
        <h2>Your Favorite Workouts</h2>
        <div id="favorite-workouts" class="grid-container"></div>
      </section>

      <!-- Section displaying all available workouts -->
      <section>
        <h2>All Workouts</h2>
        <div id="workout-grid" class="grid-container">
          <!-- List of workouts with favorite toggle buttons -->
          <div
            class="workout"
            data-name="Running"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Running</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
          <div
            class="workout"
            data-name="Cycling"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Cycling</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
          <div
            class="workout"
            data-name="Strength Training"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Strength Training</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
          <div
            class="workout"
            data-name="Swimming"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Swimming</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
          <div
            class="workout"
            data-name="Walking"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Walking</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
          <div
            class="workout"
            data-name="Functional Training"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Functional Training</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
          <div
            class="workout"
            data-name="Aerobics"
            onclick="logWorkoutPrompt(this)"
          >
            <span>Aerobics</span
            ><span class="heart" onclick="toggleFavorite(event, this)">♡</span>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Smart Fitness Tracker</p>
    </footer>

    <!-- Scripts for handling favorites and countdown functionality -->
    <script src="../js/favorites.js"></script>
    <script src="../js/challenge.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
