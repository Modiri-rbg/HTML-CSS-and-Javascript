<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script defer src="../js/challenge.js"></script>
</head>
<body>
    <header>
        <h1>Challenge Countdown</h1>

        <nav>
            <ul>
                <!-- Navigation links to different sections of the app -->
                <li><a href="../index.html">Home</a></li>
                <li><a href="workouts.html">Log Workout</a></li>
                <li><a href="stats.html">Workout Stats</a></li>
                <li><a href="goals.html">Fitness Goals</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="achievements.html">Achievements</a></li>
                <li><a href="challenge.html">Challenges</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Countdown timer display for the challenge -->
        <div id="countdown">00:00:00</div>
        
        <!-- Section to create a new challenge -->
        <section>
            <h2>Create a Challenge</h2>
            <form id="challenge-form">
                <label for="challenge-name">Challenge Name:</label>
                <input type="text" id="challenge-name" required>
                
                <label for="challenge-date">Set Date & Time:</label>
                <input type="datetime-local" id="challenge-date" required>
                
                <button type="submit">Start Challenge</button>
            </form>
        </section>
        
        <!-- Section displaying the current challenge details -->
        <section>
            <h2>Current Challenge</h2>
            <h3 id="challenge-title">No Challenge Set</h3>
            
            <!-- Button to reset the challenge -->
            <button id="reset-challenge">Reset Challenge</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Smart Fitness Tracker</p>
    </footer>
</body>
</html>
