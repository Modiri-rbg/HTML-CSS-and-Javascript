<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enroll</title>
    <link rel="stylesheet" href="FrontEnd.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html#home">Home</a></li>
          <li><a href="index.html#courses">Courses</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="enrollment">
        <h2>Enrollment Form</h2>
        <form id="enrollment-form">
          <label for="first-name">First Name:</label>
          <input type="text" id="first-name" name="first-name" required />
          <label for="last-name">Last Name:</label>
          <input type="text" id="last-name" name="last-name" required />
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
          <label for="contact-number">Contact Number:</label>
          <input
            type="text"
            id="contact-number"
            name="contact-number"
            required
          />
          <button type="submit" id="submit-enrollment">Enroll</button>
        </form>
      </section>

      <section id="success-message" class="hidden">
        <p>Enrollment Successful! Redirecting to home...</p>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 Belgium Campus. All rights reserved.</p>
    </footer>

    <script src="Enrollment.js"></script>
  </body>
</html>
